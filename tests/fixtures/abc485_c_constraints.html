<html><body><div id="task-statement"><span class="lang-en">
<section>
<h3>Constraints</h3><ul>
<li><var>2 \leq N \leq 3 \times 10^5</var></li>
<li><var>1 \leq C_i \leq N</var></li>
<li>At least two distinct values appear in <var>C_1, C_2, \ldots, C_N</var>.</li>
<li>All input values are integers.</li>
</ul>
</section>
<section>
<h3>Input</h3><p>The input is given from Standard Input in the following format:</p>
<pre><var>N</var>
<var>C_1</var> <var>C_2</var> <var>\ldots</var> <var>C_N</var>
</pre>
</section>
</span></div></body></html>
