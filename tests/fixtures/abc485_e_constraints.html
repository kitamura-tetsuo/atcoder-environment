<html><body><div id="task-statement"><span class="lang-en">
<section>
<h3>Constraints</h3><ul>
<li><var>2 \leq N \leq 2 \times 10^5</var></li>
<li><var>1 \leq M \leq 2 \times 10^5</var></li>
<li><var>1 \leq U_i, V_i \leq N</var></li>
<li><var>U_i \neq V_i</var></li>
<li><var>1 \leq C_i \leq M</var></li>
<li>All input values are integers.</li>
</ul>
</section>
<section>
<h3>Input</h3><p>The input is given from Standard Input in the following format:</p>
<pre><var>N</var> <var>M</var>
<var>U_1</var> <var>V_1</var> <var>C_1</var>
<var>U_2</var> <var>V_2</var> <var>C_2</var>
<var>\vdots</var>
<var>U_M</var> <var>V_M</var> <var>C_M</var>
</pre>
</section>
</span></div></body></html>
