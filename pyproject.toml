[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atcoder-environment"
version = "0.6.0"
description = "A Python AtCoder workspace with reproducible local judging and shrinking"
readme = "README.md"
requires-python = "==3.13.7"
license = "Apache-2.0"
dependencies = [
  "loguru==0.7.3",
  "line-profiler==5.0.0",
  "psutil==7.2.2",
  "hypothesis==6.170.17",
  "cyaron==0.7.0",
  "online-judge-tools==11.5.1",
  "online-judge-template-generator==4.8.1",
  "beautifulsoup4==4.15.0",
  "requests==2.34.2",
  "sympy==1.14.0",
  "antlr4-python3-runtime==4.11.1",
  # Legacy oj still imports distutils on Python 3.12+.
  "setuptools==80.9.0",
]

[project.scripts]
ac = "atcoder_env.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<0.15"]
# Source: https://img.atcoder.jp/file/language-update/2025-10/082-3-13_cpython.toml
judge = [
  "absl-py==2.3.1",
  "ac-library-python",
  "acl-cpp-python==0.6.2",
  "bitarray==3.6.1",
  "cppyy-backend==1.15.3",
  "cppyy-cling==6.32.8",
  "cppyy==3.5.0",
  "CPyCppyy==1.13.0",
  "Cython==3.1.3",
  "filelock==3.19.1",
  "fsspec==2025.7.0",
  "gmpy2==2.2.1",
  "immutabledict==4.2.1",
  "Jinja2==3.1.6",
  "joblib==1.5.1",
  "lightgbm==4.6.0",
  "llvmlite==0.44.0",
  "MarkupSafe==3.0.2",
  "more-itertools==10.7.0",
  "mpmath==1.3.0",
  "networkx==3.5",
  "numba==0.61.2",
  "numpy==2.2.6",
  "ortools==9.14.6206",
  "pandas==2.3.2",
  "polars==1.31.0",
  "protobuf==6.31.1",
  "PuLP==3.2.2",
  "pyrsistent==0.20.0",
  "python-dateutil==2.9.0.post0",
  "pytz==2025.2",
  "rustworkx==0.16.0",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "shapely==2.1.1",
  "six==1.17.0",
  "sortedcontainers==2.4.0",
  "sympy==1.14.0",
  "threadpoolctl==3.6.0",
  "torch==2.8.0+cpu",
  "typing_extensions==4.14.1",
  "tzdata==2025.2",
  "z3-solver==4.15.3.0",
]

[tool.uv]
default-groups = ["dev", "judge"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
ac-library-python = { git = "https://github.com/not522/ac-library-python", rev = "27fdbb71cd0d566bdeb12746db59c9d908c6b5d5" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/atcoder_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
