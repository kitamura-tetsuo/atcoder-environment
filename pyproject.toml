[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atcoder-environment"
version = "0.1.0"
description = "A Python AtCoder workspace with reproducible local judging and shrinking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "loguru==0.7.3",
  "hypothesis==6.170.17",
  "cyaron==0.7.0",
  "online-judge-tools==11.5.1",
  "online-judge-template-generator==4.8.1",
  # Legacy oj still imports distutils on Python 3.12+.
  "setuptools==80.9.0",
]

[project.scripts]
ac = "atcoder_env.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/atcoder_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
