services:
  dev:
    build:
      context: .
      args:
        LOCAL_UID: "${LOCAL_UID:-1000}"
        LOCAL_GID: "${LOCAL_GID:-1000}"
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - atcoder-home:/home/atcoder
    command: ["bash"]

volumes:
  atcoder-home:
